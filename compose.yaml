name: ${COMPOSE_PROJECT_NAME:-suma-ai}

x-n8n-database-environment: &n8n-database-environment
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
  DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di file .env}
  DB_POSTGRESDB_SCHEMA: public
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Isi N8N_ENCRYPTION_KEY di file .env}
  N8N_USER_FOLDER: /home/node/.n8n
  TZ: ${TZ:-Asia/Jakarta}
  GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Jakarta}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di file .env}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    shm_size: 128mb
    security_opt:
      - no-new-privileges:true
    networks:
      - database

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.31.7}
    restart: unless-stopped
    environment:
      <<: *n8n-database-environment
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678/}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:8080/}
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-1}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_PAYLOAD_SIZE_MAX: "20"
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-168}
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?Isi N8N_RUNNERS_AUTH_TOKEN di file .env}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "${N8N_BIND_ADDRESS:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "Promise.all([
          fetch('http://127.0.0.1:5678/healthz/readiness'),
          fetch('http://127.0.0.1:5679/healthz')])
          .then(rs=>process.exit(rs.every(r=>r.ok)?0:1))
          .catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      edge:
        gw_priority: 1
      database:
      runners:

  n8n-runner:
    image: n8nio/runners:${N8N_VERSION:-2.31.7}
    restart: unless-stopped
    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?Isi N8N_RUNNERS_AUTH_TOKEN di file .env}
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_MAX_CONCURRENCY: "2"
      N8N_RUNNERS_MAX_OLD_SPACE_SIZE: "512"
      TZ: ${TZ:-Asia/Jakarta}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Jakarta}
    depends_on:
      n8n:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:5680/healthz')
          .then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    stop_grace_period: 60s
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    networks:
      - runners

  frontend:
    image: suma-ai-frontend:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_N8N_WEBHOOK_URL: ${VITE_N8N_WEBHOOK_URL:?Isi VITE_N8N_WEBHOOK_URL di file .env}
        VITE_SUMAI_COMPANY_ID: ${VITE_SUMAI_COMPANY_ID:-COMPANY-001}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:?Isi VITE_FIREBASE_API_KEY di file .env}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:?Isi VITE_FIREBASE_AUTH_DOMAIN di file .env}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:?Isi VITE_FIREBASE_PROJECT_ID di file .env}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:?Isi VITE_FIREBASE_APP_ID di file .env}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
    depends_on:
      n8n:
        condition: service_healthy
      n8n-runner:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - edge

  n8n-import:
    profiles:
      - tools
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.31.7}
    environment:
      <<: *n8n-database-environment
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    command:
      - import:workflow
      - --input=/import/SUM-AI-Analytics-Gemini-Files.workflow.json
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/SUM-AI-Analytics-Gemini-Files.workflow.json:/import/SUM-AI-Analytics-Gemini-Files.workflow.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - database

volumes:
  postgres_data:
  n8n_data:

networks:
  edge:
  database:
    internal: true
  runners:
    internal: true
